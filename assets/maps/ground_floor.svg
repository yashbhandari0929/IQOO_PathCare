<svg width="1000" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="800" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#1976d2">
    GROUND FLOOR
  </text>
  
  <!-- Main Entrance -->
  <rect id="entrance" x="400" y="60" width="200" height="80" 
        fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="5"/>
  <text x="500" y="95" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">
    Main Entrance
  </text>
  <text x="500" y="115" text-anchor="middle" font-size="28">🚪</text>
  
  <!-- Corridor from entrance to lobby -->
  <rect x="485" y="140" width="30" height="40" fill="#e0e0e0"/>
  
  <!-- Lobby -->
  <rect id="lobby" x="300" y="180" width="400" height="120" 
        fill="#e8f5e9" stroke="#388e3c" stroke-width="3" rx="5"/>
  <text x="500" y="225" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">
    Lobby / Waiting Area
  </text>
  <text x="500" y="250" text-anchor="middle" font-size="14" fill="#555">
    Please wait here if early
  </text>
  <text x="500" y="275" text-anchor="middle" font-size="24">🪑</text>
  
  <!-- Reception -->
  <rect id="reception" x="350" y="320" width="300" height="80" 
        fill="#fff3e0" stroke="#f57c00" stroke-width="3" rx="5"/>
  <text x="500" y="355" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">
    Reception Desk
  </text>
  <text x="500" y="380" text-anchor="middle" font-size="24">🗂️</text>
  
  <!-- Left corridor -->
  <rect x="240" y="320" width="110" height="30" fill="#e0e0e0"/>
  
  <!-- Right corridor -->
  <rect x="650" y="320" width="110" height="30" fill="#e0e0e0"/>
  
  <!-- Lab A (Left) -->
  <rect id="lab_a" x="50" y="250" width="190" height="180" 
        fill="#ffebee" stroke="#c62828" stroke-width="4" rx="5"/>
  <text x="145" y="280" text-anchor="middle" font-size="18" font-weight="bold" fill="#b71c1c">
    Lab A
  </text>
  <text x="145" y="305" text-anchor="middle" font-size="14" fill="#555">
    Room: GF-001
  </text>
  <text x="145" y="330" text-anchor="middle" font-size="32">🔬</text>
  <text x="145" y="360" text-anchor="middle" font-size="13" fill="#555">
    Pathology Lab
  </text>
  <text x="145" y="380" text-anchor="middle" font-size="12" fill="#666">
    Blood Tests, Urine
  </text>
  <text x="145" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">
    Capacity: 5 patients
  </text>
  
  <!-- Queue visualization for Lab A -->
  <g id="lab_a_queue">
    <circle id="lab_a_slot_1" cx="85" cy="415" r="6" fill="#9e9e9e" stroke="#666" stroke-width="1"/>
    <circle id="lab_a_slot_2" cx="105" cy="415" r="6" fill="#9e9e9e" stroke="#666" stroke-width="1"/>
    <circle id="lab_a_slot_3" cx="125" cy="415" r="6" fill="#9e9e9e" stroke="#666" stroke-width="1"/>
    <circle id="lab_a_slot_4" cx="145" cy="415" r="6" fill="#9e9e9e" stroke="#666" stroke-width="1"/>
    <circle id="lab_a_slot_5" cx="165" cy="415" r="6" fill="#9e9e9e" stroke="#666" stroke-width="1"/>
  </g>
  
  <!-- Lab B (Right) -->
  <rect id="lab_b" x="760" y="250" width="190" height="180" 
        fill="#ffebee" stroke="#c62828" stroke-width="4" rx="5"/>
  <text x="855" y="280" text-anchor="middle" font-size="18" font-weight="bold" fill="#b71c1c">
    Lab B
  </text>
  <text x="855" y="305" text-anchor="middle" font-size="14" fill="#555">
    Room: GF-002
  </text>
  <text x="855" y="330" text-anchor="middle" font-size="32">🔬</text>
  <text x="855" y="360" text-anchor="middle" font-size="13" fill="#555">
    Pathology Lab
  </text>
  <text x="855" y="380" text-anchor="middle" font-size="12" fill="#666">
    Stool, Special Tests
  </text>
  <text x="855" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">
    Capacity: 1 patient
  </text>
  
  <!-- Queue visualization for Lab B -->
  <g id="lab_b_queue">
    <circle id="lab_b_slot_1" cx="855" cy="415" r="6" fill="#9e9e9e" stroke="#666" stroke-width="1"/>
  </g>
  
  <!-- Vertical corridor to elevator -->
  <rect x="485" y="400" width="30" height="140" fill="#e0e0e0"/>
  
  <!-- Elevator -->
  <rect id="elevator_ground" x="380" y="540" width="240" height="120" 
        fill="#e1bee7" stroke="#7b1fa2" stroke-width="4" rx="5"/>
  <text x="500" y="575" text-anchor="middle" font-size="20" font-weight="bold" fill="#6a1b9a">
    Elevator
  </text>
  <text x="500" y="605" text-anchor="middle" font-size="40">🛗</text>
  <text x="500" y="635" text-anchor="middle" font-size="12" fill="#555">
    To 1st Floor & 2nd Floor
  </text>
  
  <!-- Stairs (optional backup) -->
  <rect id="stairs" x="100" y="540" width="140" height="100" 
        fill="#b3e5fc" stroke="#0277bd" stroke-width="3" rx="5"/>
  <text x="170" y="575" text-anchor="middle" font-size="16" font-weight="bold" fill="#01579b">
    Stairs
  </text>
  <text x="170" y="605" text-anchor="middle" font-size="32">🪜</text>
  
  <!-- Restrooms -->
  <rect id="restroom" x="760" y="540" width="140" height="100" 
        fill="#c8e6c9" stroke="#388e3c" stroke-width="3" rx="5"/>
  <text x="830" y="575" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">
    Restrooms
  </text>
  <text x="830" y="605" text-anchor="middle" font-size="28">🚻</text>
  
  <!-- NAVIGATION PATHS (initially transparent) -->
  
  <!-- Combined path: Entrance to Lab A (most common) -->
  <path id="path_entrance_to_lab_a"
        d="M 500,140 L 500,240 L 300,240 L 240,240 L 240,335"
        stroke="transparent"
        stroke-width="10"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Combined path: Entrance to Lab B -->
  <path id="path_entrance_to_lab_b"
        d="M 500,140 L 500,240 L 700,240 L 760,240 L 760,335"
        stroke="transparent"
        stroke-width="10"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Path: Lab A to Elevator -->
  <path id="path_lab_a_to_elevator"
        d="M 240,430 L 240,500 L 380,500 L 380,540"
        stroke="transparent"
        stroke-width="10"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Path: Lab B to Elevator -->
  <path id="path_lab_b_to_elevator"
        d="M 760,430 L 760,500 L 620,500 L 620,540"
        stroke="transparent"
        stroke-width="10"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- MARKERS (initially hidden) -->
  
  <!-- Current Location Marker (Blue) -->
  <g id="current_location_marker" opacity="0">
    <circle cx="0" cy="0" r="14" fill="#2196f3" opacity="0.3"/>
    <circle cx="0" cy="0" r="8" fill="#1976d2"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
  
  <!-- Destination Marker (Green Pulsing) -->
  <g id="destination_marker" opacity="0">
    <circle cx="0" cy="0" r="20" fill="#4caf50" opacity="0.2">
      <animate attributeName="r" values="20;30;20" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="12" fill="#4caf50">
      <animate attributeName="r" values="12;16;12" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>
  
  <!-- Direction Arrow Marker -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" 
            refX="6" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#2196f3"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="20" y="680" width="200" height="100" fill="white" stroke="#999" stroke-width="2" rx="5"/>
    <text x="30" y="700" font-size="14" font-weight="bold" fill="#333">Legend:</text>
    
    <circle cx="35" cy="720" r="6" fill="#2196f3"/>
    <text x="50" y="725" font-size="12" fill="#333">Your Location</text>
    
    <circle cx="35" cy="740" r="6" fill="#4caf50"/>
    <text x="50" y="745" font-size="12" fill="#333">Destination</text>
    
    <line x1="30" y1="760" x2="60" y2="760" stroke="#2196f3" stroke-width="4"/>
    <text x="70" y="765" font-size="12" fill="#333">Your Path</text>
  </g>
  
  <!-- Floor indicator -->
  <rect x="850" y="20" width="130" height="40" fill="#1976d2" stroke="#0d47a1" stroke-width="2" rx="5"/>
  <text x="915" y="45" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
    GROUND FLOOR
  </text>
</svg>
